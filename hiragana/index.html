<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="color-scheme" content="light dark">
<title>ひらがな練習帳 — Hiragana Drill</title>

<script>
/* Runs before the page paints so switching themes never flashes the old one.
   The theme is a property of this screen, not of your progress, so it lives
   in browser storage rather than in progress.json. */
(function(){
  var pref = "auto";
  try{ pref = localStorage.getItem("hiragana-theme") || "auto"; }catch(e){}
  var dark = pref === "dark" || (pref === "auto" &&
    window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
})();
</script>

<style>
  /* Daylight: green rules printed on manuscript paper. */
  :root, [data-theme="light"]{
    --paper:      #E9EBE2;
    --cell:       #F2F4EC;
    --cell-wrong: #F7EDEA;
    --ink:        #1E2620;
    --ink-soft:   #5B6560;
    --rule:       #437056;
    --rule-faint: #AFC3B4;
    --shu:        #C2402A;
    --shu-soft:   #E0BDB4;
    --on-rule:    #F2F4EC;
  }

  /* Lamplight: not an inversion. The greens lift to stay readable on a dark
     ground, and the correction red moves toward coral — true vermilion goes
     muddy down here. The cell stays lighter than the page either way, because
     the cell is the surface you write on. */
  [data-theme="dark"]{
    --paper:      #151A17;
    --cell:       #1E2521;
    --cell-wrong: #2B1F1B;
    --ink:        #E4E8DE;
    --ink-soft:   #8D9992;
    --rule:       #6FA588;
    --rule-faint: #3A473F;
    --shu:        #E8705A;
    --shu-soft:   #6B3227;
    --on-rule:    #12170F;
  }

  *{ box-sizing:border-box; }

  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex; justify-content:center;
    padding:20px 16px 40px;
    -webkit-font-smoothing:antialiased;
    transition:background-color .25s ease, color .25s ease;
  }

  .sheet{
    width:100%; max-width:560px;
    display:flex; flex-direction:column; gap:22px;
  }

  /* ---------- masthead: the title line of a manuscript sheet ---------- */
  .masthead{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:12px;
    border-bottom:1.5px solid var(--rule);
    padding-bottom:8px;
  }
  .masthead .title{
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP","MS Mincho",serif;
    font-size:17px; letter-spacing:.14em; color:var(--rule);
  }
  .eyebrow{
    font-size:10px; text-transform:uppercase; letter-spacing:.22em;
    color:var(--ink-soft); font-weight:600; white-space:nowrap;
  }

  /* ---------- today's small quota ---------- */
  .today{ display:flex; flex-direction:column; gap:6px; margin-top:-10px; }
  .today-head{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .today-head .jp{
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
    font-size:13px; letter-spacing:.1em; color:var(--ink-soft);
  }
  .today-head .num{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:13px; color:var(--rule); font-variant-numeric:tabular-nums;
  }
  .today.met .today-head .num{ color:var(--shu); }
  .today-bar{ height:3px; background:var(--rule-faint); position:relative; overflow:hidden; }
  .today-bar i{
    position:absolute; left:0; top:0; bottom:0; width:0;
    background:var(--rule);
    transition:width .4s cubic-bezier(.4,0,.2,1), background-color .3s ease;
  }
  .today.met .today-bar i{ background:var(--shu); }

  /* ---------- quota controls + the past week ---------- */
  .daily{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .chip{
    font:inherit; font-size:12px; cursor:pointer; padding:5px 10px;
    border:1px solid var(--rule-faint); background:transparent;
    color:var(--ink-soft); border-radius:2px;
    font-variant-numeric:tabular-nums;
  }
  .chip:hover{ border-color:var(--rule); }
  .chip[aria-pressed="true"]{ background:var(--rule); border-color:var(--rule); color:var(--on-rule); }
  input.goal{
    width:58px; font:inherit; font-size:12px; padding:5px 7px;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    background:transparent; color:var(--ink); text-align:center;
    border:1px solid var(--rule-faint); border-radius:2px; outline:none;
  }
  input.goal:focus{ border-color:var(--rule); }

  .week{ display:flex; gap:4px; margin-left:auto; }
  .wk{
    position:relative; width:27px; height:27px; overflow:hidden;
    border:1px solid var(--rule-faint); background:var(--cell);
    display:grid; place-items:center;
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
    font-size:12px; color:var(--ink-soft);
  }
  .wk i{
    position:absolute; left:0; right:0; bottom:0; height:0;
    background:var(--rule); transition:height .4s ease;
  }
  .wk em{ position:relative; z-index:2; font-style:normal; }
  .wk.met{ border-color:var(--rule); }
  .wk.met em{ color:var(--on-rule); }
  .wk.now{ outline:1.5px solid var(--shu); outline-offset:-2px; }

  /* ---------- the genkō yōshi cell ---------- */
  .cell-wrap{ position:relative; display:flex; justify-content:center; }
  .cell{
    position:relative;
    width:min(280px, 68vw); aspect-ratio:1;
    background:var(--cell);
    border:1.5px solid var(--rule);
    display:grid; place-items:center;
    transition: border-color .2s ease, background-color .2s ease;
  }
  .cell.wrong{ border-color:var(--shu); background:var(--cell-wrong); }
  .cell.shake{ animation:shake .3s ease; }
  @keyframes shake{
    0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)}
    50%{transform:translateX(4px)} 75%{transform:translateX(-2px)}
  }
  .cell::before, .cell::after{
    content:""; position:absolute; background:var(--rule-faint);
  }
  .cell::before{ left:50%; top:6%; bottom:6%; width:1px; }
  .cell::after{ top:50%; left:6%; right:6%; height:1px; }

  .kana{
    position:relative; z-index:2;
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP","MS Mincho",serif;
    font-size:min(150px, 36vw); line-height:1; color:var(--ink);
    user-select:none;
  }

  /* the red teacher's circle */
  .maru{ position:absolute; inset:0; z-index:3; pointer-events:none; }
  .maru path{
    fill:none; stroke:var(--shu); stroke-width:2.6; stroke-linecap:round;
    stroke-dasharray:100; stroke-dashoffset:100; opacity:0;
  }
  .maru.show path{ stroke-dashoffset:0; opacity:1; transition:stroke-dashoffset .42s cubic-bezier(.4,0,.2,1), opacity .1s; }

  /* red-pen correction in the margin */
  .correction{
    position:absolute; z-index:4;
    left:calc(100% + 12px); top:12px;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:19px; color:var(--shu); white-space:nowrap;
    opacity:0; transition:opacity .15s ease;
  }
  .correction.show{ opacity:1; }
  @media (max-width:620px){ .correction{ display:none; } }

  /* ---------- tally: two 正 characters, one stroke per correct answer ---------- */
  .tally-row{
    display:flex; align-items:center; justify-content:center; gap:14px;
    min-height:52px;
  }
  .tally{ display:flex; gap:10px; }
  .tally svg{ width:44px; height:44px; }
  .tally line{
    stroke:var(--rule); stroke-width:6; stroke-linecap:round;
    stroke-dasharray:100; stroke-dashoffset:100;
  }
  .tally line.on{ stroke-dashoffset:0; transition:stroke-dashoffset .3s cubic-bezier(.4,0,.2,1); }
  .tally-label{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-soft); font-weight:600;
  }

  /* ---------- answer line ---------- */
  .answer-line{ display:flex; flex-direction:column; gap:8px; }
  input.answer{
    width:100%; background:transparent; border:0;
    border-bottom:1.5px solid var(--rule);
    padding:8px 2px; font-size:26px;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    color:var(--ink); text-align:center; letter-spacing:.08em;
    outline:none;
  }
  input.answer::placeholder{ color:var(--rule-faint); letter-spacing:.02em; font-size:17px; }
  input.answer:focus{ border-bottom-width:2.5px; }
  .hint{
    font-size:11px; letter-spacing:.1em; color:var(--ink-soft);
    text-align:center; min-height:15px;
  }
  .hint b{ color:var(--shu); font-weight:600; }

  /* ---------- footer ---------- */
  .rules{ border-top:1px solid var(--rule-faint); padding-top:14px; display:flex; flex-direction:column; gap:14px; }
  .sets{ display:flex; flex-wrap:wrap; gap:8px; }
  .set-btn{
    font:inherit; font-size:12px; cursor:pointer;
    padding:6px 11px; border:1px solid var(--rule-faint);
    background:transparent; color:var(--ink-soft); border-radius:2px;
    display:flex; align-items:center; gap:7px;
  }
  .set-btn:hover{ border-color:var(--rule); }
  .set-btn[aria-pressed="true"]{ background:var(--rule); border-color:var(--rule); color:var(--on-rule); }
  .set-btn .jp{ font-family:"Hiragino Mincho ProN","Yu Mincho",serif; font-size:14px; }
  .set-btn .n{ opacity:.7; font-variant-numeric:tabular-nums; }

  .stats{
    display:flex; gap:18px; flex-wrap:wrap;
    font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-soft); font-weight:600;
  }
  .stats span b{ color:var(--ink); font-variant-numeric:tabular-nums; font-size:13px; }

  .actions{ display:flex; gap:16px; flex-wrap:wrap; }
  .link{
    background:none; border:0; padding:0; cursor:pointer; font:inherit;
    font-size:11px; letter-spacing:.12em; text-transform:uppercase; font-weight:600;
    color:var(--ink-soft); border-bottom:1px solid var(--rule-faint);
  }
  .link:hover{ color:var(--ink); border-color:var(--rule); }
  .link.danger:hover{ color:var(--shu); border-color:var(--shu); }

  /* 日 / 自 / 月 — sun, self-acting, moon */
  .theme-switch{
    margin-left:auto; display:flex; border:1px solid var(--rule-faint);
    border-radius:2px; overflow:hidden;
  }
  .theme-switch button{
    font:inherit; cursor:pointer; background:transparent; border:0;
    border-left:1px solid var(--rule-faint);
    padding:4px 10px; color:var(--ink-soft);
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif; font-size:14px; line-height:1.3;
    transition:background-color .15s ease, color .15s ease;
  }
  .theme-switch button:first-child{ border-left:0; }
  .theme-switch button:hover{ color:var(--ink); }
  .theme-switch button[aria-pressed="true"]{ background:var(--rule); color:var(--on-rule); }
  .theme-switch button:focus-visible{ outline:2px solid var(--shu); outline-offset:-2px; }

  .save-note{
    font-size:10px; letter-spacing:.14em; text-transform:uppercase; font-weight:600;
    color:var(--rule); display:flex; align-items:center; gap:7px;
  }
  .save-note::before{
    content:""; width:6px; height:6px; border-radius:50%; background:var(--rule); flex:none;
  }
  .save-note.warn{ color:var(--shu); }
  .save-note.warn::before{ background:var(--shu); }

  /* ---------- the sheet overview ---------- */
  .grid{ display:none; grid-template-columns:repeat(auto-fill,minmax(46px,1fr)); gap:5px; }
  .grid.open{ display:grid; }
  .g-cell{
    position:relative; aspect-ratio:1; display:grid; place-items:center;
    border:1px solid var(--rule-faint); background:var(--cell);
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif; font-size:20px;
  }
  .g-cell .n{
    position:absolute; bottom:1px; right:3px; font-family:ui-monospace,monospace;
    font-size:9px; color:var(--rule); font-weight:700;
  }
  .g-cell.done{ border-color:var(--shu-soft); }
  .g-cell.done .ring{
    position:absolute; inset:4px; border:1.5px solid var(--shu); border-radius:50%;
  }
  .g-cell.done .n{ display:none; }
  .g-cell.zero{ color:var(--ink-soft); opacity:.5; }

  .hidden{ display:none !important; }

  .done-state{ text-align:center; padding:20px 0; }
  .done-state .big{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif; font-size:76px; color:var(--shu);
  }
  .done-state p{ font-size:13px; color:var(--ink-soft); margin:6px 0 0; }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>
<div class="sheet">

  <div class="masthead">
    <span class="title">ひらがな練習帳</span>
    <span class="eyebrow" id="retired-count">0 / 46 retired</span>
  </div>

  <div class="today" id="today">
    <div class="today-head">
      <span class="jp">今日の分</span>
      <span class="num" id="today-num">0 / 20</span>
    </div>
    <div class="today-bar"><i id="today-fill"></i></div>
  </div>

  <div id="drill">
    <div class="cell-wrap">
      <div class="cell" id="cell">
        <div class="kana" id="kana">あ</div>
        <svg class="maru" id="maru" viewBox="0 0 100 100" aria-hidden="true">
          <path pathLength="100" d="M54,8 C28,8 8,27 8,50 C8,73 27,92 51,92 C76,92 92,72 92,48 C92,26 76,9 55,8 C47,7.6 42,9.5 37,13"/>
        </svg>
        <div class="correction" id="correction"></div>
      </div>
    </div>

    <div class="tally-row">
      <div class="tally" id="tally"></div>
      <span class="tally-label" id="tally-label">0 / 10</span>
    </div>

    <div class="answer-line">
      <input class="answer" id="answer" type="text" placeholder="type the reading"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
             aria-label="Romaji reading">
      <div class="hint" id="hint">Enter to check</div>
    </div>
  </div>

  <div id="finished" class="done-state hidden">
    <div class="big">完</div>
    <p id="finished-msg">Every character in this set is retired.</p>
  </div>

  <div class="rules">
    <div class="sets" id="sets"></div>
    <div class="daily" id="daily" role="group" aria-label="Daily quota">
      <span class="eyebrow">Daily</span>
      <button class="chip" data-goal="10">10</button>
      <button class="chip" data-goal="20">20</button>
      <button class="chip" data-goal="40">40</button>
      <input class="goal" id="goal" type="number" min="1" max="500" step="1"
             inputmode="numeric" aria-label="Custom daily quota">
      <div class="week" id="week" aria-label="The past seven days"></div>
    </div>
    <div class="stats">
      <span>Session <b id="s-acc">—</b></span>
      <span>Streak <b id="s-streak">0</b></span>
      <span>Answers <b id="s-total">0</b></span>
    </div>
    <div class="save-note" id="save-note">Checking where to save</div>
    <div class="actions">
      <button class="link" id="toggle-grid">Show sheet</button>
      <button class="link" id="export">Download progress.json</button>
      <button class="link danger" id="reset">Reset progress</button>
      <div class="theme-switch" id="theme-switch" role="group" aria-label="Colour theme">
        <button data-theme-pref="light" aria-label="Light" title="Light">日</button>
        <button data-theme-pref="auto"  aria-label="Match system" title="Match system">自</button>
        <button data-theme-pref="dark"  aria-label="Dark" title="Dark">月</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ------------------------------------------------------------------ data */
const KANA = {
  gojuon: [
    ["あ",["a"]],["い",["i"]],["う",["u"]],["え",["e"]],["お",["o"]],
    ["か",["ka"]],["き",["ki"]],["く",["ku"]],["け",["ke"]],["こ",["ko"]],
    ["さ",["sa"]],["し",["shi","si"]],["す",["su"]],["せ",["se"]],["そ",["so"]],
    ["た",["ta"]],["ち",["chi","ti"]],["つ",["tsu","tu"]],["て",["te"]],["と",["to"]],
    ["な",["na"]],["に",["ni"]],["ぬ",["nu"]],["ね",["ne"]],["の",["no"]],
    ["は",["ha"]],["ひ",["hi"]],["ふ",["fu","hu"]],["へ",["he"]],["ほ",["ho"]],
    ["ま",["ma"]],["み",["mi"]],["む",["mu"]],["め",["me"]],["も",["mo"]],
    ["や",["ya"]],["ゆ",["yu"]],["よ",["yo"]],
    ["ら",["ra"]],["り",["ri"]],["る",["ru"]],["れ",["re"]],["ろ",["ro"]],
    ["わ",["wa"]],["を",["wo","o"]],
    ["ん",["n","nn"]]
  ],
  dakuten: [
    ["が",["ga"]],["ぎ",["gi"]],["ぐ",["gu"]],["げ",["ge"]],["ご",["go"]],
    ["ざ",["za"]],["じ",["ji","zi"]],["ず",["zu"]],["ぜ",["ze"]],["ぞ",["zo"]],
    ["だ",["da"]],["ぢ",["ji","di","dzi"]],["づ",["zu","du","dzu"]],["で",["de"]],["ど",["do"]],
    ["ば",["ba"]],["び",["bi"]],["ぶ",["bu"]],["べ",["be"]],["ぼ",["bo"]],
    ["ぱ",["pa"]],["ぴ",["pi"]],["ぷ",["pu"]],["ぺ",["pe"]],["ぽ",["po"]]
  ],
  yoon: [
    ["きゃ",["kya"]],["きゅ",["kyu"]],["きょ",["kyo"]],
    ["しゃ",["sha","sya"]],["しゅ",["shu","syu"]],["しょ",["sho","syo"]],
    ["ちゃ",["cha","tya"]],["ちゅ",["chu","tyu"]],["ちょ",["cho","tyo"]],
    ["にゃ",["nya"]],["にゅ",["nyu"]],["にょ",["nyo"]],
    ["ひゃ",["hya"]],["ひゅ",["hyu"]],["ひょ",["hyo"]],
    ["みゃ",["mya"]],["みゅ",["myu"]],["みょ",["myo"]],
    ["りゃ",["rya"]],["りゅ",["ryu"]],["りょ",["ryo"]],
    ["ぎゃ",["gya"]],["ぎゅ",["gyu"]],["ぎょ",["gyo"]],
    ["じゃ",["ja","jya","zya"]],["じゅ",["ju","jyu","zyu"]],["じょ",["jo","jyo","zyo"]],
    ["びゃ",["bya"]],["びゅ",["byu"]],["びょ",["byo"]],
    ["ぴゃ",["pya"]],["ぴゅ",["pyu"]],["ぴょ",["pyo"]]
  ]
};

const SET_META = [
  { id:"gojuon",  jp:"五十音", en:"Basic" },
  { id:"dakuten", jp:"濁音",   en:"Dakuten" },
  { id:"yoon",    jp:"拗音",   en:"Combos" }
];

const TARGET = 10;   // correct answers needed to retire a character

/* --------------------------------------------------------- storage layer */
/* Four places progress can live, in order of preference:
   server   — POSTs to the local Python host, which writes progress.json
   artifact — window.storage, when this page runs inside a Claude artifact
   local    — the browser's own storage, when opened as a bare file
   memory   — nothing persists; the page says so out loud                 */
const Store = (function(){
  const KEY = "hiragana-drill-v1";
  let mode = "memory";

  async function init(){
    try{
      const res = await fetch("api/progress", { cache:"no-store" });
      const type = res.headers.get("content-type") || "";
      if(res.ok && type.indexOf("application/json") !== -1){
        mode = "server";
        const data = await res.json();
        return (data && data.counts) ? data : null;
      }
    }catch(e){ /* no server here */ }

    if(window.storage && typeof window.storage.get === "function"){
      mode = "artifact";
      try{
        const r = await window.storage.get(KEY);
        return (r && r.value) ? JSON.parse(r.value) : null;
      }catch(e){ return null; }
    }

    try{
      localStorage.setItem("__probe","1"); localStorage.removeItem("__probe");
      mode = "local";
      const v = localStorage.getItem(KEY);
      return v ? JSON.parse(v) : null;
    }catch(e){ /* blocked */ }

    mode = "memory";
    return null;
  }

  async function put(data){
    const body = JSON.stringify(data);
    if(mode === "server"){
      const res = await fetch("api/progress", {
        method:"POST", headers:{"Content-Type":"application/json"}, body:body
      });
      if(!res.ok) throw new Error("server refused the save");
      return;
    }
    if(mode === "artifact"){ await window.storage.set(KEY, body); return; }
    if(mode === "local"){ localStorage.setItem(KEY, body); return; }
  }

  // last-gasp write when the tab closes, so the final answer isn't lost
  function flush(data){
    const body = JSON.stringify(data);
    if(mode === "server" && navigator.sendBeacon){
      navigator.sendBeacon("api/progress", new Blob([body], {type:"application/json"}));
    } else if(mode === "local"){
      try{ localStorage.setItem(KEY, body); }catch(e){}
    }
  }

  const LABEL = {
    server:   ["Saving to progress.json", false],
    artifact: ["Saving in this chat", false],
    local:    ["Saving in this browser only", false],
    memory:   ["Not saving — progress ends with this tab", true]
  };

  return {
    init: init, put: put, flush: flush,
    get mode(){ return mode; },
    get label(){ return LABEL[mode]; }
  };
})();

/* ----------------------------------------------------------------- state */
let state = {
  version: 1,
  counts: {},
  sets: { gojuon:true, dakuten:false, yoon:false },
  daily: { goal:20, log:{} }     // log is { "2026-10-01": attempts }
};
let session = { total:0, correct:0, streak:0 };
let current = null;
let awaiting = false;
let pendingNote = "";
let recentMiss = new Set();

const $ = function(id){ return document.getElementById(id); };

/* Local calendar day, not UTC. At UTC+3 a UTC key would roll the day over at
   3am local and split one late-night sitting across two days. */
function dayKey(d){
  const pad = function(n){ return (n < 10 ? "0" : "") + n; };
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}
function today(){ return dayKey(new Date()); }

function doneToday(){ return state.daily.log[today()] || 0; }

/* Keep the log from growing without limit — the week strip only reads 7 days
   and the rest is just history. */
function trimLog(){
  const keys = Object.keys(state.daily.log).sort();
  const excess = keys.length - 120;
  for(let i = 0; i < excess; i++) delete state.daily.log[keys[i]];
}

function payload(){
  return {
    version: 1,
    counts: state.counts,
    sets: state.sets,
    daily: state.daily,
    updated: new Date().toISOString()
  };
}

let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    Store.put(payload()).catch(function(err){
      console.error(err);
      const note = $("save-note");
      note.textContent = "Save failed — is server.py still running?";
      note.classList.add("warn");
    });
  }, 350);
}

/* ----------------------------------------------------------------- logic */
function activeList(){
  let out = [];
  SET_META.forEach(function(m){ if(state.sets[m.id]) out = out.concat(KANA[m.id]); });
  return out;
}
function countOf(k){ return state.counts[k] || 0; }
function pool(){ return activeList().filter(function(e){ return countOf(e[0]) < TARGET; }); }

function pickNext(){
  const p = pool();
  if(p.length === 0){ current = null; return; }
  const candidates = (p.length > 1 && current)
    ? p.filter(function(e){ return e[0] !== current[0]; }) : p;
  const weights = candidates.map(function(e){
    let w = (TARGET - countOf(e[0])) + 1;      // weaker characters come up more
    if(recentMiss.has(e[0])) w *= 3;           // and a fresh miss comes back soon
    return w;
  });
  let roll = Math.random() * weights.reduce(function(a,b){ return a+b; }, 0);
  for(let i = 0; i < candidates.length; i++){
    roll -= weights[i];
    if(roll <= 0){ current = candidates[i]; return; }
  }
  current = candidates[candidates.length - 1];
}

function normalize(s){
  return s.toLowerCase().trim().replace(/[\s\-'’_]/g, "");
}

function submit(){
  const input = $("answer");
  if(awaiting){ nextCard(); return; }
  if(!current) return;
  const given = normalize(input.value);
  if(!given) return;

  session.total++;
  const k = current[0];
  const ok = current[1].some(function(r){ return r === given; });

  /* Attempts count, not correct answers. A quota you can only fill by
     performing well is worst on exactly the days this feature is for. */
  const key = today();
  const was = state.daily.log[key] || 0;
  state.daily.log[key] = was + 1;
  const justMet = was + 1 === state.daily.goal;
  trimLog();

  if(ok){
    state.counts[k] = Math.min(TARGET, countOf(k) + 1);
    session.correct++; session.streak++;
    recentMiss.delete(k);
    input.value = "";
    $("maru").classList.add("show");
    renderTally();
    const retired = state.counts[k] === TARGET;
    $("hint").innerHTML = retired ? "覚えた — retired from the deck" : "&nbsp;";
    setTimeout(nextCard, retired ? 1100 : 620);
  } else {
    state.counts[k] = Math.max(0, countOf(k) - 1);
    session.streak = 0;
    recentMiss.add(k);
    awaiting = true;
    $("cell").classList.add("wrong","shake");
    setTimeout(function(){ $("cell").classList.remove("shake"); }, 320);
    $("correction").textContent = "→ " + current[1][0];
    $("correction").classList.add("show");
    $("hint").innerHTML = k + " = <b>" + current[1][0] + "</b> &nbsp;·&nbsp; Enter to continue";
    input.value = "";
    renderTally();
  }
  save();
  if(justMet) pendingNote = "今日の分 — that's today's. Stop here, or keep going.";
  renderToday();
  renderWeek();
  renderStats();
  renderGrid();
}

function nextCard(){
  awaiting = false;
  $("maru").classList.remove("show");
  $("cell").classList.remove("wrong");
  $("correction").classList.remove("show");
  $("hint").innerHTML = pendingNote || "Enter to check";
  pendingNote = "";
  pickNext();
  render();
  $("answer").focus();
}

/* ---------------------------------------------------------------- render */
// 正 — five strokes in correct stroke order. Two of them make ten.
const SEI_STROKES = [
  [20,20, 80,20],   // 1  top horizontal
  [36,20, 36,84],   // 2  tall vertical
  [17,52, 36,52],   // 3  left stub
  [68,38, 68,84],   // 4  right vertical
  [17,84, 84,84]    // 5  base
];

function buildTally(){
  const wrap = $("tally");
  wrap.innerHTML = "";
  for(let g = 0; g < 2; g++){
    const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("viewBox","0 0 100 100");
    SEI_STROKES.forEach(function(s){
      const ln = document.createElementNS("http://www.w3.org/2000/svg","line");
      ln.setAttribute("x1",s[0]); ln.setAttribute("y1",s[1]);
      ln.setAttribute("x2",s[2]); ln.setAttribute("y2",s[3]);
      ln.setAttribute("pathLength","100");
      svg.appendChild(ln);
    });
    wrap.appendChild(svg);
  }
}

function renderTally(){
  const n = current ? countOf(current[0]) : 0;
  const lines = $("tally").querySelectorAll("line");
  for(let i = 0; i < lines.length; i++) lines[i].classList.toggle("on", i < n);
  $("tally-label").textContent = n + " / " + TARGET;
}

function renderSets(){
  const wrap = $("sets");
  wrap.innerHTML = "";
  SET_META.forEach(function(m){
    const list = KANA[m.id];
    const done = list.filter(function(e){ return countOf(e[0]) === TARGET; }).length;
    const b = document.createElement("button");
    b.className = "set-btn";
    b.setAttribute("aria-pressed", state.sets[m.id] ? "true" : "false");
    b.innerHTML = '<span class="jp">' + m.jp + '</span>' + m.en +
                  ' <span class="n">' + done + '/' + list.length + '</span>';
    b.onclick = function(){
      const on = SET_META.filter(function(x){ return state.sets[x.id]; });
      if(state.sets[m.id] && on.length === 1) return;   // keep at least one set on
      state.sets[m.id] = !state.sets[m.id];
      save();
      if(!current || countOf(current[0]) === TARGET || !state.sets[m.id]) pickNext();
      render();
      $("answer").focus();
    };
    wrap.appendChild(b);
  });
}

function renderGrid(){
  const g = $("grid");
  if(!g.classList.contains("open")) return;
  g.innerHTML = "";
  activeList().forEach(function(e){
    const n = countOf(e[0]);
    const d = document.createElement("div");
    d.className = "g-cell" + (n === TARGET ? " done" : (n === 0 ? " zero" : ""));
    d.title = e[0] + " = " + e[1][0] + "  ·  " + n + "/" + TARGET;
    d.innerHTML = e[0] + (n === TARGET
      ? '<span class="ring"></span>' : '<span class="n">' + n + '</span>');
    g.appendChild(d);
  });
}

function renderToday(){
  const goal = state.daily.goal;
  const n = doneToday();
  const met = n >= goal;
  $("today").classList.toggle("met", met);
  $("today-num").textContent = n + " / " + goal + (met ? " ✓" : "");
  $("today-fill").style.width = Math.min(100, goal ? n / goal * 100 : 0) + "%";

  const chips = $("daily").querySelectorAll(".chip");
  for(let i = 0; i < chips.length; i++){
    chips[i].setAttribute("aria-pressed",
      Number(chips[i].dataset.goal) === goal ? "true" : "false");
  }
  const box = $("goal");
  if(document.activeElement !== box) box.value = goal;
}

/* Seven cells ending today. A streak number has a cliff to fall off, which
   punishes the low-energy day this whole feature exists to accommodate;
   a strip of days just shows what happened. */
const WEEKDAY_JP = ["日","月","火","水","木","金","土"];

function renderWeek(){
  const wrap = $("week");
  wrap.innerHTML = "";
  const goal = state.daily.goal;
  for(let back = 6; back >= 0; back--){
    const d = new Date();
    d.setDate(d.getDate() - back);
    const n = state.daily.log[dayKey(d)] || 0;
    const met = n >= goal && n > 0;
    const cell = document.createElement("div");
    cell.className = "wk" + (met ? " met" : "") + (back === 0 ? " now" : "");
    cell.title = dayKey(d) + " · " + n + " answer" + (n === 1 ? "" : "s");
    cell.innerHTML = '<i style="height:' +
      Math.min(100, goal ? n / goal * 100 : 0) + '%"></i><em>' +
      WEEKDAY_JP[d.getDay()] + '</em>';
    wrap.appendChild(cell);
  }
}

function setGoal(n){
  n = Math.max(1, Math.min(500, Math.round(n || 0)));
  state.daily.goal = n;
  save();
  renderToday();
  renderWeek();
}

function renderStats(){
  $("s-total").textContent  = session.total;
  $("s-streak").textContent = session.streak;
  $("s-acc").textContent = session.total
    ? Math.round(session.correct / session.total * 100) + "%" : "—";
  const list = activeList();
  const done = list.filter(function(e){ return countOf(e[0]) === TARGET; }).length;
  $("retired-count").textContent = done + " / " + list.length + " retired";
}

function render(){
  const finished = !current;
  $("drill").classList.toggle("hidden", finished);
  $("finished").classList.toggle("hidden", !finished);
  if(!finished){ $("kana").textContent = current[0]; renderTally(); }
  else {
    $("finished-msg").textContent = SET_META.every(function(m){ return state.sets[m.id]; })
      ? "Every character is retired. Nothing left to drill."
      : "This set is done. Turn on another set below, or reset.";
  }
  renderSets(); renderStats(); renderGrid(); renderToday(); renderWeek();
}

/* ------------------------------------------------------------------ wire */
$("daily").addEventListener("click", function(e){
  const chip = e.target.closest(".chip");
  if(!chip) return;
  setGoal(Number(chip.dataset.goal));
  $("answer").focus();
});
$("goal").addEventListener("input", function(){
  const v = Number($("goal").value);
  if(v >= 1 && v <= 500) setGoal(v);
});
$("goal").addEventListener("blur", function(){ renderToday(); });
$("goal").addEventListener("keydown", function(e){
  e.stopPropagation();                       // digits shouldn't reach the drill
  if(e.key === "Enter"){ $("answer").focus(); }
});

$("answer").addEventListener("keydown", function(e){
  // stopPropagation: otherwise this same Enter reaches the document listener
  // below after submit() has set awaiting, and skips the correction at once
  if(e.key === "Enter"){ e.preventDefault(); e.stopPropagation(); submit(); }
});
document.addEventListener("keydown", function(e){
  if(awaiting && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); nextCard(); }
});
document.addEventListener("click", function(e){
  const tag = e.target.tagName;
  if(tag !== "BUTTON" && tag !== "INPUT") $("answer").focus();
});
window.addEventListener("pagehide", function(){
  clearTimeout(saveTimer);
  Store.flush(payload());
});

/* ----------------------------------------------------------------- theme */
const Theme = (function(){
  const KEY = "hiragana-theme";
  const query = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  let pref = "auto";
  try{ pref = localStorage.getItem(KEY) || "auto"; }catch(e){}

  function apply(){
    const dark = pref === "dark" || (pref === "auto" && query && query.matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    const buttons = $("theme-switch").querySelectorAll("button");
    for(let i = 0; i < buttons.length; i++){
      buttons[i].setAttribute("aria-pressed",
        buttons[i].dataset.themePref === pref ? "true" : "false");
    }
  }
  function set(next){
    pref = next;
    try{ localStorage.setItem(KEY, next); }catch(e){}
    apply();
  }
  if(query){
    const onChange = function(){ if(pref === "auto") apply(); };
    if(query.addEventListener) query.addEventListener("change", onChange);
    else if(query.addListener) query.addListener(onChange);
  }
  return { apply: apply, set: set };
})();

$("theme-switch").addEventListener("click", function(e){
  const b = e.target.closest("button[data-theme-pref]");
  if(!b) return;
  Theme.set(b.dataset.themePref);
  $("answer").focus();
});

$("toggle-grid").onclick = function(){
  const g = $("grid");
  g.classList.toggle("open");
  $("toggle-grid").textContent = g.classList.contains("open") ? "Hide sheet" : "Show sheet";
  renderGrid();
};

$("export").onclick = function(){
  const blob = new Blob([JSON.stringify(payload(), null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "progress.json";
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
};

$("reset").onclick = function(){
  const b = $("reset");
  if(b.dataset.armed){
    state.counts = {}; recentMiss.clear();
    session = { total:0, correct:0, streak:0 };
    delete b.dataset.armed; b.textContent = "Reset progress";
    save(); nextCard();
  } else {
    b.dataset.armed = "1"; b.textContent = "Tap again to erase all counts";
    setTimeout(function(){
      if(b.dataset.armed){ delete b.dataset.armed; b.textContent = "Reset progress"; }
    }, 4000);
  }
};

(async function init(){
  buildTally();
  Theme.apply();
  const saved = await Store.init();
  if(saved){
    if(saved.counts) state.counts = saved.counts;
    if(saved.sets) state.sets = Object.assign(state.sets, saved.sets);
    if(saved.daily){                       // absent in files written before this
      if(typeof saved.daily.goal === "number") state.daily.goal = saved.daily.goal;
      if(saved.daily.log) state.daily.log = saved.daily.log;
    }
  }
  const label = Store.label;
  $("save-note").textContent = label[0];
  $("save-note").classList.toggle("warn", label[1]);
  pickNext();
  render();
  $("answer").focus();
})();

})();
</script>
</body>
